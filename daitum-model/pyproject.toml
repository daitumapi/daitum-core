[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daitum-model"
version = "2.5.0"
description = "Model and formula generation library for the Daitum platform"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Daitum" }]
requires-python = ">=3.10"
keywords = ["optimisation", "modelling", "daitum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["typeguard>=4.4"]

[project.urls]
Homepage = "https://daitum.com"
Documentation = "https://docs.daitum.com"
Repository = "https://github.com/daitumapi/daitum-core"

[tool.setuptools.packages.find]
where = ["src"]

# Linting, formatting, and type-checking config is shared across the monorepo
# and lives only in the root pyproject.toml (pipelines/lint.sh runs the tools
# from the repo root).
